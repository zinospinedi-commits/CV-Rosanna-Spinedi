  <style>

    :root{
      --bg:#0f172a;
      --panel:#111827;
      --panel-soft:#172033;
      --text:#f1f5f9;
      --muted:#94a3b8;
      --line:#1e293b;
      --accent:#3b82f6;
      --accent-2:#38bdf8;
      --radius:18px;
      --shadow:0 20px 50px rgba(0,0,0,.28);
    }

    *{
      box-sizing:border-box;
    }

    html,body{
      min-height:100%;
    }

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.55;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:40px 20px 72px;
    }

    /* TOP BAR */

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:14px;
      margin-bottom:18px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .dot{
      width:10px;
      height:10px;
      border-radius:999px;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      box-shadow:0 0 0 4px rgba(59,130,246,.10);
    }

    .muted{
      color:var(--muted);
    }

    .lang{
      font-size:.9rem;
      color:var(--muted);
      display:flex;
      align-items:center;
      gap:8px;
      user-select:none;
    }

    .btn{
      border:1px solid var(--line);
      background:#fff;
      color:#0f172a;
      border-radius:999px;
      padding:8px 13px;
      font-size:.9rem;
      font-weight:600;
      cursor:pointer;
      transition:.15s ease;
    }

    .btn:hover{
      transform:translateY(-1px);
      box-shadow:0 10px 20px rgba(0,0,0,.18);
    }

    /* HERO */

    .hero{
      border:1px solid var(--line);
      background:
        linear-gradient(
          180deg,
          rgba(59,130,246,.07),
          rgba(56,189,248,.02)
        );

      border-radius:var(--radius);
      padding:24px;
      box-shadow:var(--shadow);
      position:relative;
      overflow:hidden;
    }

    .hero::after{
      content:"";
      position:absolute;
      right:-110px;
      top:-120px;
      width:280px;
      height:280px;
      border-radius:50%;
      background:
        radial-gradient(
          circle at 30% 30%,
          rgba(59,130,246,.22),
          transparent 60%
        );
      pointer-events:none;
    }

    .hero-inner{
      display:grid;
      grid-template-columns:200px 1fr;
      gap:30px;
      align-items:center;
      position:relative;
      z-index:1;
    }

    .avatar{
      width:200px;
      height:200px;
      border-radius:30px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.15);
      box-shadow:0 20px 40px rgba(0,0,0,.45);
      background:#eef4ff;
    }

    .avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      display:block;
    }

    h1{
      margin:0;
      font-size:2.35rem;
      letter-spacing:-.7px;
      line-height:1.1;
    }

    .sub{
      margin-top:12px;
      color:var(--muted);
      display:flex;
      flex-wrap:wrap;
      gap:10px 14px;
      align-items:center;
      font-size:.98rem;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:7px 11px;
      border-radius:999px;
      background:#fff;
      border:1px solid rgba(59,130,246,.25);
      color:#0f172a;
    }

    .pill i{
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--accent);
      display:inline-block;
      box-shadow:0 0 0 4px rgba(59,130,246,.10);
    }

    /* MAIN GRID */

    .grid{
      margin-top:22px;
      display:grid;
      grid-template-columns:320px 1fr;
      gap:18px;
      align-items:start;
    }

    .card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:18px;
    }

    /* SIDEBAR */

    .left.card{
      background:
        linear-gradient(
          180deg,
          #1b2638,
          #111827
        );
    }

    @media(min-width:861px){
      .left.card{
        position:sticky;
        top:18px;
      }
    }

    .kicker{
      font-size:.78rem;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:#60a5fa;
      margin:0 0 10px;
    }

    .section-title{
      display:flex;
      align-items:center;
      gap:10px;
      margin:0 0 12px;
    }

    .section-title h2{
      margin:0;
      font-size:1.05rem;
      letter-spacing:-.2px;
    }

    .line{
      height:1px;
      flex:1;
      background:
        linear-gradient(
          90deg,
          rgba(59,130,246,.65),
          rgba(56,189,248,.12),
          transparent
        );
    }

    /* TAGS */

    .pills{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:8px;
    }

    .tag{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(59,130,246,.30);
      background:rgba(59,130,246,.09);
      font-size:.86rem;
      transition:.15s ease;
    }

    .tag:hover{
      transform:translateY(-1px);
      border-color:rgba(59,130,246,.55);
      background:rgba(59,130,246,.14);
    }

    /* FACTS */

    .facts{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:10px;
    }

    .fact{
      display:flex;
      gap:10px;
      align-items:flex-start;
      padding:11px;
      border-radius:14px;
      border:1px solid rgba(148,163,184,.18);
      background:rgba(255,255,255,.035);
    }

    .fact .icon{
      width:31px;
      height:31px;
      border-radius:10px;
      background:rgba(59,130,246,.12);
      display:grid;
      place-items:center;
      flex:0 0 auto;
    }

    .fact .label{
      font-size:.82rem;
      color:var(--muted);
      margin-bottom:2px;
    }

    .fact .value{
      font-size:.92rem;
      color:var(--text);
      word-break:break-word;
    }

    /* CONTENT */

    .block{
      margin-bottom:22px;
    }

    .para{
      margin:0;
      color:var(--text);
    }

    .job{
      padding:16px;
      border-radius:16px;
      border:1px solid rgba(148,163,184,.20);
      background:var(--panel-soft);
      margin-top:12px;
      transition:.15s ease;
    }

    .job:hover{
      transform:translateY(-1px);
      border-color:rgba(59,130,246,.40);
      box-shadow:0 14px 28px rgba(0,0,0,.15);
    }

    .job-head{
      display:flex;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      align-items:baseline;
    }

    .job-title{
      font-weight:700;
      font-size:1.02rem;
      letter-spacing:-.2px;
    }

    .job-meta{
      color:var(--muted);
      font-size:.9rem;
      white-space:nowrap;
    }

    ul{
      margin:10px 0 0;
      padding-left:19px;
    }

    li{
      margin:6px 0;
    }

    /* ANIMATIONS */

    .reveal{
      opacity:0;
      transform:translateY(10px);
      transition:
        opacity .45s ease,
        transform .45s ease;
    }

    .reveal.visible{
      opacity:1;
      transform:translateY(0);
    }

    .stagger li{
      opacity:0;
      transform:translateY(6px);
    }

    .stagger.visible li{
      animation:rise .36s ease forwards;
    }

    .stagger.visible li:nth-child(1){animation-delay:.04s;}
    .stagger.visible li:nth-child(2){animation-delay:.08s;}
    .stagger.visible li:nth-child(3){animation-delay:.12s;}
    .stagger.visible li:nth-child(4){animation-delay:.16s;}
    .stagger.visible li:nth-child(5){animation-delay:.20s;}
    .stagger.visible li:nth-child(6){animation-delay:.24s;}
    .stagger.visible li:nth-child(7){animation-delay:.28s;}

    @keyframes rise{
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    /* RESPONSIVE */

    @media(max-width:860px){

      .grid{
        grid-template-columns:1fr;
      }

    }

    @media(max-width:700px){

      .wrap{
        padding:24px 14px 50px;
      }

      .hero-inner{
        grid-template-columns:1fr;
      }

      .avatar{
        width:170px;
        height:170px;
      }

      h1{
        font-size:1.9rem;
      }

    }

    @media(prefers-reduced-motion:reduce){

      *{
        animation:none !important;
        transition:none !important;
      }

      .reveal{
        opacity:1;
        transform:none;
      }

      .stagger li{
        opacity:1;
        transform:none;
      }

    }

    /* PRINT */

    @media print{

      .top{
        display:none;
      }

      body{
        background:white;
        color:black;
      }

      .wrap{
        padding:0;
      }

      .hero,
      .card,
      .job{
        box-shadow:none;
      }

    }

  </style>
</head>

<script>

  /* ================================
     LANGUAGE SWITCH
  ================================= */

  let lang = "de";

  function applyLang(){

    document
      .querySelectorAll("[data-de]")
      .forEach(el => {

        el.textContent = el.dataset[lang];

      });

    document
      .getElementById("langBtn")
      .textContent = lang.toUpperCase();

    document.documentElement.lang = lang;

  }


  document
    .getElementById("langBtn")
    .addEventListener("click", () => {

      lang = (lang === "de") ? "fr" : "de";

      applyLang();

    });



  /* ================================
     SCROLL ANIMATIONS
  ================================= */

  const revealEls =
    Array.from(
      document.querySelectorAll(".reveal, .stagger")
    );


  const observer =
    new IntersectionObserver(

      entries => {

        entries.forEach(entry => {

          if(entry.isIntersecting){

            entry.target
              .classList
              .add("visible");

          }

        });

      },

      {
        threshold:.10
      }

    );


  revealEls.forEach(el => observer.observe(el));


  applyLang();

</script>
